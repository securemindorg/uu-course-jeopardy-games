<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spooky Management of Technology Jeopardy</title>
    <style>
        :root {
            --spooky-dark: #0b0f19;
            --spooky-purple: #1e1b4b;
            --pumpkin-orange: #f97316;
            --pumpkin-hover: #ea580c;
            --ghost-white: #f8fafc;
            --card-bg: #111827;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border: #374151;
            --jeopardy-blue: #1d4ed8;
            --jeopardy-gold: #facc15;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--spooky-dark);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            line-height: 1.5;
            background-image: radial-gradient(circle at 10% 20%, rgba(249, 115, 22, 0.05) 0%, transparent 40%),
                              radial-gradient(circle at 90% 80%, rgba(30, 27, 75, 0.4) 0%, transparent 50%);
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
        }

        /* Animated Spider Web Thread & Spider */
        .spider-container {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2000;
            pointer-events: none;
            animation: spiderDropLift 3.8s ease-in-out forwards;
        }

        .spider-thread {
            width: 2px;
            height: 220px;
            background: linear-gradient(to bottom, rgba(255,255,255,0.8), rgba(255,255,255,0.3));
            margin: 0 auto;
            box-shadow: 0 0 5px rgba(255,255,255,0.5);
        }

        .spider-svg {
            width: 45px;
            height: 45px;
            margin-top: -2px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.8));
        }

        @keyframes spiderDropLift {
            0% { transform: translate(-50%, -240px); }
            35% { transform: translate(-50%, 0px); }
            55% { transform: translate(-50%, 0px); }
            100% { transform: translate(-50%, -180px); }
        }

        /* GitHub Button in Upper Right */
        .github-corner {
            position: absolute;
            top: 0;
            right: 0;
            background-color: var(--pumpkin-orange);
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(249, 115, 22, 0.3);
            transition: background-color 0.2s, transform 0.1s;
            font-size: 0.9rem;
            z-index: 10;
        }

        .github-corner:hover {
            background-color: var(--pumpkin-hover);
            transform: translateY(-1px);
        }

        .github-corner svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        header {
            background-color: var(--card-bg);
            color: white;
            padding: 25px 20px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 25px;
            border: 2px solid var(--border);
            border-bottom: 5px solid var(--pumpkin-orange);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: "🕸️";
            position: absolute;
            top: 10px;
            left: 15px;
            font-size: 1.8rem;
            opacity: 0.8;
        }
        header::after {
            content: "🎃";
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 1.8rem;
            opacity: 0.8;
        }

        header h1 {
            margin: 0 0 5px 0;
            font-size: 2.2rem;
            letter-spacing: 0.5px;
            color: var(--ghost-white);
        }

        header h2 {
            margin: 0 0 5px 0;
            font-size: 1.1rem;
            color: var(--pumpkin-orange);
            font-weight: 600;
            text-transform: uppercase;
        }

        header p {
            margin: 0;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* Jeopardy Board Grid */
        .board {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-bottom: 25px;
        }

        .category-header {
            background-color: var(--spooky-purple);
            color: var(--ghost-white);
            padding: 15px 10px;
            text-align: center;
            font-weight: bold;
            font-size: 0.85rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            border-bottom: 3px solid var(--pumpkin-orange);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 55px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .tile {
            background-color: var(--jeopardy-blue);
            color: var(--jeopardy-gold);
            font-size: 1.8rem;
            font-weight: bold;
            padding: 25px 10px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            user-select: none;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .tile:hover {
            background-color: #2563eb;
            transform: scale(1.03);
            box-shadow: 0 6px 12px rgba(29, 78, 216, 0.4);
        }

        .tile.used {
            background-color: #1f2937;
            color: #4b5563;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
            border: 1px solid #111827;
        }

        /* Modal Overlay */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(11, 15, 25, 0.88);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-content {
            background-color: var(--card-bg);
            color: var(--text-main);
            padding: 35px;
            border-radius: 12px;
            max-width: 750px;
            width: 100%;
            text-align: center;
            border: 2px solid var(--border);
            border-top: 8px solid var(--pumpkin-orange);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            animation: modalPop 0.2s ease-out;
            max-height: 90vh;
            overflow-y: auto;
        }

        @keyframes modalPop {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .modal-category {
            font-size: 1rem;
            text-transform: uppercase;
            color: var(--pumpkin-orange);
            font-weight: bold;
            margin-bottom: 5px;
        }

        .modal-value {
            font-size: 1.4rem;
            color: var(--jeopardy-gold);
            font-weight: bold;
            margin-bottom: 15px;
        }

        .modal-question {
            font-size: 1.3rem;
            color: var(--ghost-white);
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .question-image {
            max-width: 340px;
            width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 10px auto 20px auto;
            display: block;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .modal-answer-container {
            display: none;
            margin-bottom: 25px;
            background: #1f2937;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .modal-answer-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 3px;
            font-weight: bold;
        }

        .modal-answer {
            font-size: 1.15rem;
            color: #34d399;
            font-weight: bold;
        }

        .modal-controls {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        button {
            background-color: var(--pumpkin-orange);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: var(--pumpkin-hover);
            transform: translateY(-1px);
        }

        button.secondary {
            background-color: #374151;
            color: var(--ghost-white);
        }
        button.secondary:hover {
            background-color: #4b5563;
        }

        @media (max-width: 768px) {
            .board { grid-template-columns: repeat(1, 1fr); }
            .tile { font-size: 1.2rem; padding: 15px; }
            .github-corner { position: relative; margin-bottom: 15px; justify-content: center; }
        }
    </style>
</head>
<body>

<div class="spider-container">
    <div class="spider-thread"></div>
    <svg class="spider-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="50" cy="65" rx="18" ry="22" fill="#1e1e1e" stroke="#f97316" stroke-width="2"/>
        <circle cx="50" cy="40" r="12" fill="#111111" stroke="#f97316" stroke-width="1.5"/>
        <circle cx="45" cy="38" r="2.5" fill="#f97316"/>
        <circle cx="55" cy="38" r="2.5" fill="#f97316"/>
        <path d="M 42 38 Q 20 20 10 35" fill="none" stroke="#1e1e1e" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M 40 42 Q 15 35 5 55" fill="none" stroke="#1e1e1e" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M 40 46 Q 15 55 8 75" fill="none" stroke="#1e1e1e" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M 42 50 Q 20 70 15 90" fill="none" stroke="#1e1e1e" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M 58 38 Q 80 20 90 35" fill="none" stroke="#1e1e1e" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M 60 42 Q 85 35 95 55" fill="none" stroke="#1e1e1e" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M 60 46 Q 85 55 92 75" fill="none" stroke="#1e1e1e" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M 58 50 Q 80 70 85 90" fill="none" stroke="#1e1e1e" stroke-width="3.5" stroke-linecap="round"/>
    </svg>
</div>

<div class="container">
    <a href="https://github.com/securemindorg/Spooky-MGT-Jeopardy" target="_blank" class="github-corner">
        <svg viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
        GitHub Repo
    </a>

    <header>
        <h2>MGT 325: Management of Technology Lab</h2>
        <h1>🎃 Spooky Tech & Networks Jeopardy 👻</h1>
        <p>Utica University • Halloween Review Session</p>
    </header>

    <div class="board" id="jeopardy-board"></div>
</div>

<div class="modal" id="question-modal">
    <div class="modal-content">
        <div class="modal-category" id="m-category">Category</div>
        <div class="modal-value" id="m-value">$100</div>
        <div class="modal-question" id="m-question">Question text goes here...</div>
        <div id="image-container"></div>
        <div class="modal-answer-container" id="m-answer-container">
            <div class="modal-answer-label">Correct Answer:</div>
            <div class="modal-answer" id="m-answer">Answer text goes here...</div>
        </div>
        <div class="modal-controls">
            <button id="btn-reveal" onclick="revealAnswer()">Show Answer</button>
            <button class="secondary" onclick="closeModal()">Close / Return to Board</button>
        </div>
    </div>
</div>

<script>
    // Embedded Base64 SVG Diagrams
    const dataMiningPipelineImg = "data:image/svg+xml;base64," + btoa(
        '<svg xmlns="http://www.w3.org/2000/svg" width="300" height="150" viewBox="0 0 300 150">' +
        '<rect width="300" height="150" fill="#111827" rx="8"/>' +
        '<rect x="15" y="55" width="75" height="50" rx="4" fill="#1e1b4b" stroke="#f97316" stroke-width="1.5"/>' +
        '<text x="52.5" y="77" font-family="sans-serif" font-size="10" fill="#f8fafc" text-anchor="middle" font-weight="bold">Raw Storage</text>' +
        '<text x="52.5" y="92" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">(Unstructured)</text>' +
        '<path d="M 92 80 L 112 80" stroke="#f97316" stroke-width="2" stroke-dasharray="3"/>' +
        '<rect x="112" y="55" width="75" height="50" rx="4" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1.5"/>' +
        '<text x="149.5" y="77" font-family="sans-serif" font-size="10" fill="#f8fafc" text-anchor="middle" font-weight="bold">Data Mining</text>' +
        '<text x="149.5" y="92" font-family="sans-serif" font-size="9" fill="#38bdf8" text-anchor="middle">(Patterns)</text>' +
        '<path d="M 187 80 L 207 80" stroke="#f97316" stroke-width="2" stroke-dasharray="3"/>' +
        '<rect x="207" y="45" width="80" height="70" rx="4" fill="#1e1b4b" stroke="#34d399" stroke-width="2"/>' +
        '<text x="247" y="70" font-family="sans-serif" font-size="10" fill="#34d399" text-anchor="middle" font-weight="bold">Actionable</text>' +
        '<text x="247" y="85" font-family="sans-serif" font-size="10" fill="#34d399" text-anchor="middle" font-weight="bold">Intelligence</text>' +
        '<text x="247" y="100" font-family="sans-serif" font-size="9" fill="#f8fafc" text-anchor="middle">(Decisions)</text>' +
        '</svg>'
    );

    const netScaleImg = "data:image/svg+xml;base64," + btoa(
        '<svg xmlns="http://www.w3.org/2000/svg" width="300" height="150" viewBox="0 0 300 150">' +
        '<rect width="300" height="150" fill="#111827" rx="8"/>' +
        '<circle cx="70" cy="75" r="45" fill="none" stroke="#f97316" stroke-width="2" stroke-dasharray="4"/>' +
        '<text x="70" y="70" font-family="sans-serif" font-size="11" fill="#f97316" text-anchor="middle" font-weight="bold">PAN / LAN</text>' +
        '<text x="70" y="85" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Personal / Local</text>' +
        '<path d="M 115 75 L 185 75" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>' +
        '<circle cx="230" cy="75" r="45" fill="none" stroke="#34d399" stroke-width="2"/>' +
        '<text x="230" y="70" font-family="sans-serif" font-size="11" fill="#34d399" text-anchor="middle" font-weight="bold">MAN / WAN</text>' +
        '<text x="230" y="85" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Metro / Global</text>' +
        '</svg>'
    );

    const gameData = [
        {
            category: "Haunted Networks (PAN/LAN/MAN/WAN)",
            questions: [
                { value: 100, q: "This smallest scale network connects personal devices like wireless mice, smartwatches, and Bluetooth headphones within arm's reach.", a: "What is a PAN (Personal Area Network)?" },
                { value: 200, q: "A computer network that connects computers and devices within a limited physical area such as a haunted house, office building, or campus.", a: "What is a LAN (Local Area Network)?" },
                { value: 300, q: "A network type that spans a larger geographic area than a LAN, typically covering an entire city or municipal region.", a: "What is a MAN (Metropolitan Area Network)?" },
                { value: 400, q: "The vast global network connecting millions of private, public, and business networks across countries and continents, best exemplified by the internet.", a: "What is a WAN (Wide Area Network)?", image: netScaleImg },
                { value: 500, q: "In networking, this robust topology uses multiple redundant interconnection paths between nodes so that data can route around dead or failed gateways.", a: "What is a Mesh Network?" }
            ]
        },
        {
            category: "Data Mining Crypts",
            questions: [
                { value: 100, q: "This automated process sifts through massive enterprise data repositories to unearth hidden patterns, correlations, and anomalies.", a: "What is Business Data Mining?" },
                { 
                    value: 200, 
                    q: "As depicted in this pipeline, data mining turns raw, unstructured enterprise storage into this valuable output for executive decision-makers.", 
                    a: "What is actionable intelligence (or business intelligence / knowledge)?",
                    image: dataMiningPipelineImg
                },
                { value: 300, q: "A data mining rule that discovers co-occurrence relationships, famously used in retail to find that customers who buy Halloween candy also buy spooky decorations.", a: "What is Association Rule Mining (or Market Basket Analysis)?" },
                { value: 400, q: "An unsupervised data mining technique that groups unlabelled ghost records into natural clusters based on similarity.", a: "What is Clustering (e.g., K-Means)?" },
                { value: 500, q: "A predictive data mining technique that assigns data items to predefined classes or categories using historical training data.", a: "What is Classification (or Decision Trees)?" }
            ]
        },
        {
            category: "Ghost in the Machine (IS Strategy)",
            questions: [
                { value: 100, q: "This foundational framework consists of People, Technology, Processes, and Structure, showing that tech alone is not an information system.", a: "What is Leavitt's Diamond?" },
                { value: 200, q: "Hardware, software, or cloud solutions deployed and used by business units or employees without explicit IT department approval or oversight.", a: "What is Shadow IT?" },
                { value: 300, q: "Michael Porter’s model that identifies specific primary and support activities in which an enterprise can leverage IS to gain competitive advantage.", a: "What is the Value Chain?" },
                { value: 400, q: "The three primary ways an organization can achieve competitive advantage using information systems include cost leadership, focus, and this.", a: "What is Differentiation?" },
                { value: 500, q: "This executive leader is responsible for aligning information technology strategy with overall corporate goals and business objectives.", a: "Who is the Chief Information Officer (CIO)?" }
            ]
        },
        {
            category: "Cybersecurity Cobwebs",
            questions: [
                { value: 100, q: "The core security triad consists of Confidentiality, Integrity, and this third principle ensuring systems and records remain operational when needed.", a: "What is Availability?" },
                { value: 200, q: "In the AAA security framework, authentication answers 'Who are you?', authorization answers 'What can you do?', and accounting answers this.", a: "What is 'What did you do?' (tracking user actions and audit logs)" },
                { value: 300, q: "Specialized malware that encrypts operational files or system data and demands extortion payments for decryption keys.", a: "What is Ransomware?" },
                { value: 400, q: "A deceptive phishing attack targeted specifically at high-profile executives, VIPs, or wealthy targets within an organization.", a: "What is Whaling (or Spear Phishing)?" },
                { value: 500, q: "The core component of data management that defines governance policies, roles, and responsibilities to ensure data can be trusted enterprise-wide.", a: "What is Data Governance?" }
            ]
        },
        {
            category: "Witchy Web & Cloud",
            questions: [
                { value: 100, q: "Software produced by vendors to address common needs across businesses, often contrasted with custom proprietary software.", a: "What is Off-the-Shelf Software?" },
                { value: 200, q: "A service delivery model that allows businesses to subscribe to web-delivered application software hosted in the cloud.", a: "What is Software as a Service (SaaS)?" },
                { value: 300, q: "This individual invented the World Wide Web, originally conceiving it as an internal document management system.", a: "Who is Sir Tim Berners-Lee?" },
                { value: 400, q: "An internal corporate network built using internet and web standards that allows employees to access important corporate documents securely.", a: "What is an Intranet?" },
                { value: 500, q: "A climate- and access-controlled facility housing the computer hardware that delivers an organization's data and information services ('the cloud').", a: "What is a Data Center?" }
            ]
        }
    ];

    const boardEl = document.getElementById('jeopardy-board');
    const modalEl = document.getElementById('question-modal');
    const mCategory = document.getElementById('m-category');
    const mValue = document.getElementById('m-value');
    const mQuestion = document.getElementById('m-question');
    const imageContainer = document.getElementById('image-container');
    const mAnswerContainer = document.getElementById('m-answer-container');
    const mAnswer = document.getElementById('m-answer');
    const btnReveal = document.getElementById('btn-reveal');

    let currentTile = null;

    function buildBoard() {
        boardEl.innerHTML = '';
        gameData.forEach(col => {
            const header = document.createElement('div');
            header.className = 'category-header';
            header.innerText = col.category;
            boardEl.appendChild(header);
        });

        for (let rowIndex = 0; rowIndex < 5; rowIndex++) {
            gameData.forEach((col, colIndex) => {
                const qData = col.questions[rowIndex];
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.innerText = `$${qData.value}`;
                tile.dataset.col = colIndex;
                tile.dataset.row = rowIndex;
                tile.onclick = () => openQuestion(colIndex, rowIndex, tile);
                boardEl.appendChild(tile);
            });
        }
    }

    function openQuestion(colIndex, rowIndex, tile) {
        if (tile.classList.contains('used')) return;

        currentTile = tile;
        const qData = gameData[colIndex].questions[rowIndex];

        mCategory.innerText = gameData[colIndex].category;
        mValue.innerText = `$${qData.value}`;
        mQuestion.innerText = qData.q;
        mAnswer.innerText = qData.a;
        
        if (qData.image) {
            imageContainer.innerHTML = `<img src="${qData.image}" class="question-image" alt="Data Mining Diagram">`;
            imageContainer.style.display = 'block';
        } else {
            imageContainer.innerHTML = '';
            imageContainer.style.display = 'none';
        }

        mAnswerContainer.style.display = 'none';
        btnReveal.style.display = 'inline-block';
        modalEl.style.display = 'flex';
    }

    function revealAnswer() {
        mAnswerContainer.style.display = 'block';
        btnReveal.style.display = 'none';
    }

    function closeModal() {
        modalEl.style.display = 'none';
        if (currentTile) {
            currentTile.classList.add('used');
            currentTile.innerText = '—';
        }
    }

    buildBoard();
</script>

</body>
</html>
