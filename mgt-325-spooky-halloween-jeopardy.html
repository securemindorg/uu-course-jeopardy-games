<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spooky Management of Technology Jeopardy</title>
    <style>
        :root {
            --spooky-dark: #0b0f19;
            --spooky-purple: #1e1b4b;
            --pumpkin-orange: #f97316;
            --pumpkin-hover: #ea580c;
            --ghost-white: #f8fafc;
            --card-bg: #111827;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border: #374151;
            --jeopardy-blue: #1d4ed8;
            --jeopardy-gold: #facc15;
            --success-green: #10b981;
            --danger-red: #ef4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--spooky-dark);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            line-height: 1.4;
            background-image: radial-gradient(circle at 10% 20%, rgba(249, 115, 22, 0.05) 0%, transparent 40%),
                              radial-gradient(circle at 90% 80%, rgba(30, 27, 75, 0.4) 0%, transparent 50%);
            overflow-x: hidden;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
        }

        /* Animated Spider Web Thread & Spider */
        .spider-container {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2000;
            pointer-events: none;
            animation: spiderDropLift 3.8s ease-in-out forwards;
        }

        .spider-thread {
            width: 2px;
            height: 180px;
            background: linear-gradient(to bottom, rgba(255,255,255,0.8), rgba(255,255,255,0.3));
            margin: 0 auto;
            box-shadow: 0 0 5px rgba(255,255,255,0.5);
        }

        .spider-svg {
            width: 40px;
            height: 40px;
            margin-top: -2px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.8));
        }

        @keyframes spiderDropLift {
            0% { transform: translate(-50%, -200px); }
            35% { transform: translate(-50%, 0px); }
            55% { transform: translate(-50%, 0px); }
            100% { transform: translate(-50%, -150px); }
        }

        /* GitHub Button in Upper Right */
        .github-corner {
            position: absolute;
            top: 0;
            right: 0;
            background-color: var(--pumpkin-orange);
            color: white;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 12px rgba(249, 115, 22, 0.3);
            transition: background-color 0.2s, transform 0.1s;
            font-size: 0.85rem;
            z-index: 10;
        }

        .github-corner:hover {
            background-color: var(--pumpkin-hover);
            transform: translateY(-1px);
        }

        .github-corner svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        header {
            background-color: var(--card-bg);
            color: white;
            padding: 15px 20px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 15px;
            border: 2px solid var(--border);
            border-bottom: 4px solid var(--pumpkin-orange);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
            position: relative;
        }

        header h1 {
            margin: 0 0 2px 0;
            font-size: 1.8rem;
            letter-spacing: 0.5px;
            color: var(--ghost-white);
        }

        header h2 {
            margin: 0 0 2px 0;
            font-size: 0.95rem;
            color: var(--pumpkin-orange);
            font-weight: 600;
            text-transform: uppercase;
        }

        header p {
            margin: 0;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        /* Application Navigation Tabs */
        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 5px;
        }

        .nav-tab {
            background-color: #1f2937;
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 8px 18px;
            font-weight: 600;
            font-size: 0.95rem;
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }

        .nav-tab:hover {
            color: var(--ghost-white);
            background-color: #374151;
        }

        .nav-tab.active {
            background-color: var(--pumpkin-orange);
            color: white;
            border-color: var(--pumpkin-orange);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Two-Column Layout (Board + Right Sidebar) */
        .game-layout {
            display: grid;
            grid-template-columns: 1fr 280px;
            gap: 15px;
            align-items: start;
        }

        /* Jeopardy Board Grid */
        .board {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }

        .category-header {
            background-color: var(--spooky-purple);
            color: var(--ghost-white);
            padding: 12px 6px;
            text-align: center;
            font-weight: bold;
            font-size: 0.8rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            border-bottom: 3px solid var(--pumpkin-orange);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 50px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .tile {
            background-color: var(--jeopardy-blue);
            color: var(--jeopardy-gold);
            font-size: 1.6rem;
            font-weight: bold;
            padding: 20px 5px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            user-select: none;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .tile:hover {
            background-color: #2563eb;
            transform: scale(1.02);
        }

        .tile.used {
            background-color: #1f2937;
            color: #4b5563;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
            border: 1px solid #111827;
        }

        /* Sidebar Scoreboard */
        .sidebar-scoreboard {
            background-color: var(--card-bg);
            border: 2px solid var(--border);
            border-top: 4px solid var(--pumpkin-orange);
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.4);
            position: sticky;
            top: 15px;
        }

        .sidebar-title {
            font-size: 1.1rem;
            color: var(--pumpkin-orange);
            font-weight: bold;
            margin: 0 0 12px 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-align: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
        }

        .sidebar-teams-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sidebar-team-card {
            background-color: #1f2937;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .sidebar-team-name {
            font-weight: bold;
            font-size: 0.95rem;
            color: var(--ghost-white);
            margin-bottom: 4px;
            word-break: break-word;
        }

        .sidebar-team-score {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--jeopardy-gold);
            margin-bottom: 6px;
        }

        .sidebar-adjust-btns {
            display: flex;
            gap: 6px;
        }

        .btn-mini {
            background-color: #374151;
            color: white;
            border: none;
            padding: 2px 8px;
            font-size: 0.75rem;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-mini:hover {
            background-color: #4b5563;
        }

        /* Team Setup Tab Styling */
        .setup-container {
            background-color: var(--card-bg);
            border: 2px solid var(--border);
            border-top: 4px solid var(--pumpkin-orange);
            border-radius: 12px;
            padding: 25px;
            max-width: 800px;
            margin: 0 auto;
        }

        .setup-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        .team-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .team-input-group input {
            flex: 1;
            background-color: #1f2937;
            border: 1px solid var(--border);
            color: var(--ghost-white);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
        }

        .team-input-group input:focus {
            border-color: var(--pumpkin-orange);
        }

        .setup-teams-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
        }

        .setup-team-card {
            background-color: #1f2937;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            position: relative;
            text-align: center;
        }

        .btn-delete-team {
            position: absolute;
            top: 5px;
            right: 8px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1rem;
            cursor: pointer;
        }

        .btn-delete-team:hover {
            color: var(--danger-red);
        }

        /* Modal Overlay */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(11, 15, 25, 0.88);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-content {
            background-color: var(--card-bg);
            color: var(--text-main);
            padding: 30px;
            border-radius: 12px;
            max-width: 750px;
            width: 100%;
            text-align: center;
            border: 2px solid var(--border);
            border-top: 8px solid var(--pumpkin-orange);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            animation: modalPop 0.2s ease-out;
            max-height: 90vh;
            overflow-y: auto;
        }

        @keyframes modalPop {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .modal-category {
            font-size: 1rem;
            text-transform: uppercase;
            color: var(--pumpkin-orange);
            font-weight: bold;
            margin-bottom: 5px;
        }

        .modal-value {
            font-size: 1.4rem;
            color: var(--jeopardy-gold);
            font-weight: bold;
            margin-bottom: 15px;
        }

        .modal-question {
            font-size: 1.25rem;
            color: var(--ghost-white);
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .question-image {
            max-width: 320px;
            width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 10px auto 15px auto;
            display: block;
            border: 1px solid var(--border);
        }

        .modal-answer-container {
            display: none;
            margin-bottom: 20px;
            background: #1f2937;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .modal-answer-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 3px;
            font-weight: bold;
        }

        .modal-answer {
            font-size: 1.1rem;
            color: #34d399;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .award-section {
            border-top: 1px solid var(--border);
            padding-top: 12px;
        }

        .award-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            color: var(--pumpkin-orange);
            font-weight: bold;
            margin-bottom: 8px;
        }

        .award-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        .btn-award {
            background-color: var(--spooky-purple);
            color: var(--ghost-white);
            border: 1px solid var(--pumpkin-orange);
            padding: 6px 12px;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn-award:hover {
            background-color: var(--pumpkin-orange);
        }

        .btn-award-none {
            background-color: #374151;
            border: 1px solid var(--border);
        }

        .btn-award-none:hover {
            background-color: #4b5563;
        }

        .modal-controls {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        button {
            background-color: var(--pumpkin-orange);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--pumpkin-hover);
        }

        button.secondary {
            background-color: #374151;
            color: var(--ghost-white);
        }
        button.secondary:hover {
            background-color: #4b5563;
        }

        @media (max-width: 900px) {
            .game-layout { grid-template-columns: 1fr; }
            .sidebar-scoreboard { position: static; }
        }
    </style>
</head>

    <header>
        <h2>MGT 325: Management of Technology Lab</h2>
        <h1>🎃 Spooky Tech & Networks Jeopardy 👻</h1>
        <p>Utica University • Halloween Review Session</p>
    </header>

    <!-- Navigation Tabs -->
    <div class="nav-tabs">
        <button class="nav-tab active" onclick="switchTab('game-tab')">🎮 Game Board</button>
        <button class="nav-tab" onclick="switchTab('setup-tab')">⚙️ Team Setup</button>

    <!-- TAB 1: Game Board Layout -->
    <div id="game-tab" class="tab-content active">

<div class="modal" id="question-modal">

                { value: 100, q: "This smallest scale network connects personal devices like wireless mice, smartwatches, and Bluetooth headphones within arm's reach.", a: "What is a PAN (Personal Area Network)?" },

                { value: 300, q: "A network type that spans a larger geographic area than a LAN, typically covering an entire city or municipal region.", a: "What is a MAN (Metropolitan Area Network)?" },
                { value: 400, q: "The vast global network connecting millions of private, public, and business networks across countries and continents, best exemplified by the internet.", a: "What is a WAN (Wide Area Network)?", image: netScaleImg },
                { value: 500, q: "In networking, this robust topology uses multiple redundant interconnection paths between nodes so that data can route around dead or failed gateways.", a: "What is a Mesh Network?" }
            ]
        },
        {
            category: "Data Mining Crypts",
            questions: [
                { value: 100, q: "This automated process sifts through massive enterprise data repositories to unearth hidden patterns, correlations, and anomalies.", a: "What is Business Data Mining?" },
                { 
                    value: 200, 
                    q: "As depicted in this pipeline, data mining turns raw, unstructured enterprise storage into this valuable output for executive decision-makers.", 
                    a: "What is actionable intelligence (or business intelligence / knowledge)?",
                    image: dataMiningPipelineImg
                },
                { value: 300, q: "A data mining rule that discovers co-occurrence relationships, famously used in retail to find that customers who buy Halloween candy also buy spooky decorations.", a: "What is Association Rule Mining (or Market Basket Analysis)?" },
                { value: 400, q: "An unsupervised data mining technique that groups unlabelled ghost records into natural clusters based on similarity.", a: "What is Clustering (e.g., K-Means)?" },
                { value: 500, q: "A predictive data mining technique that assigns data items to predefined classes or categories using historical training data.", a: "What is Classification (or Decision Trees)?" }
            ]
        },
        {
            category: "Ghost in the Machine (IS Strategy)",
            questions: [
                { value: 100, q: "This foundational framework consists of People, Technology, Processes, and Structure, showing that tech alone is not an information system.", a: "What is Leavitt's Diamond?" },
                { value: 200, q: "Hardware, software, or cloud solutions deployed and used by business units or employees without explicit IT department approval or oversight.", a: "What is Shadow IT?" },
                { value: 300, q: "Michael Porter’s model that identifies specific primary and support activities in which an enterprise can leverage IS to gain competitive advantage.", a: "What is the Value Chain?" },
                { value: 400, q: "The three primary ways an organization can achieve competitive advantage using information systems include cost leadership, focus, and this.", a: "What is Differentiation?" },
                { value: 500, q: "This executive leader is responsible for aligning information technology strategy with overall corporate goals and business objectives.", a: "Who is the Chief Information Officer (CIO)?" }
            ]
        },
        {
            category: "Cybersecurity Cobwebs",
            questions: [
                { value: 100, q: "The core security triad consists of Confidentiality, Integrity, and this third principle ensuring systems and records remain operational when needed.", a: "What is Availability?" },
                { value: 200, q: "In the AAA security framework, authentication answers 'Who are you?', authorization answers 'What can you do?', and accounting answers this.", a: "What is 'What did you do?' (tracking user actions and audit logs)" },
                { value: 300, q: "Specialized malware that encrypts operational files or system data and demands extortion payments for decryption keys.", a: "What is Ransomware?" },
                { value: 400, q: "A deceptive phishing attack targeted specifically at high-profile executives, VIPs, or wealthy targets within an organization.", a: "What is Whaling (or Spear Phishing)?" },
                { value: 500, q: "The core component of data management that defines governance policies, roles, and responsibilities to ensure data can be trusted enterprise-wide.", a: "What is Data Governance?" }
            ]
        },
        {
            category: "Witchy Web & Cloud",
            questions: [
                { value: 100, q: "Software produced by vendors to address common needs across businesses, often contrasted with custom proprietary software.", a: "What is Off-the-Shelf Software?" },
                { value: 200, q: "A service delivery model that allows businesses to subscribe to web-delivered application software hosted in the cloud.", a: "What is Software as a Service (SaaS)?" },
                { value: 300, q: "This individual invented the World Wide Web, originally conceiving it as an internal document management system.", a: "Who is Sir Tim Berners-Lee?" },
                { value: 400, q: "An internal corporate network built using internet and web standards that allows employees to access important corporate documents securely.", a: "What is an Intranet?" },
                { value: 500, q: "A climate- and access-controlled facility housing the computer hardware that delivers an organization's data and information services ('the cloud').", a: "What is a Data Center?" }
            ]
        }
    ];

    // App State
    let teams = JSON.parse(localStorage.getItem('spooky_jeopardy_teams')) || [
        { name: "Team Vampires", score: 0 },
        { name: "Team Werewolves", score: 0 }
    ];
    let currentTile = null;
    let currentQuestionValue = 0;

    const boardEl = document.getElementById('jeopardy-board');
    const modalEl = document.getElementById('question-modal');
    const mCategory = document.getElementById('m-category');
    const mValue = document.getElementById('m-value');
    const mQuestion = document.getElementById('m-question');
    const imageContainer = document.getElementById('image-container');
    const mAnswerContainer = document.getElementById('m-answer-container');
    const mAnswer = document.getElementById('m-answer');
    const btnReveal = document.getElementById('btn-reveal');
    const mAwardButtons = document.getElementById('m-award-buttons');
    const sidebarTeamsContainer = document.getElementById('sidebar-teams-container');
    const setupTeamsContainer = document.getElementById('setup-teams-container');

    function switchTab(tabId) {
        document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        
        if (tabId === 'game-tab') {
            document.querySelectorAll('.nav-tab')[0].classList.add('active');
            document.getElementById('game-tab').classList.add('active');
        } else {
            document.querySelectorAll('.nav-tab')[1].classList.add('active');
            document.getElementById('setup-tab').classList.add('active');
        }
    }

    function saveTeams() {
        localStorage.setItem('spooky_jeopardy_teams', JSON.stringify(teams));
    }

    function renderScoreboards() {
        // Render Sidebar View
        sidebarTeamsContainer.innerHTML = '';
        if (teams.length === 0) {
            sidebarTeamsContainer.innerHTML = `<div style="color: var(--text-muted); text-align: center; font-size: 0.85rem;">No teams added. Use 'Team Setup' tab.</div>`;
        } else {
            teams.forEach((team, index) => {
                const card = document.createElement('div');
                card.className = 'sidebar-team-card';
                card.innerHTML = `
                    <div class="sidebar-team-name">${escapeHtml(team.name)}</div>
                    <div class="sidebar-team-score">$${team.score}</div>
                    <div class="sidebar-adjust-btns">
                        <button class="btn-mini" onclick="adjustScore(${index}, -100)">-$100</button>
                        <button class="btn-mini" onclick="adjustScore(${index}, 100)">+$100</button>
                    </div>
                `;
                sidebarTeamsContainer.appendChild(card);
            });
        }

        // Render Setup View
        setupTeamsContainer.innerHTML = '';
        teams.forEach((team, index) => {
            const card = document.createElement('div');
            card.className = 'setup-team-card';
            card.innerHTML = `
                <button class="btn-delete-team" onclick="deleteTeam(${index})" title="Remove Team">✕</button>
                <div style="font-weight: bold; font-size: 1.1rem; color: var(--ghost-white);">${escapeHtml(team.name)}</div>
                <div style="font-size: 1.5rem; color: var(--jeopardy-gold); margin: 8px 0;">$${team.score}</div>
                <button class="btn-mini" onclick="adjustScore(${index}, -100)">-$100</button>
                <button class="btn-mini" onclick="adjustScore(${index}, 100)">+$100</button>
            `;
            setupTeamsContainer.appendChild(card);
        });
    }

    function addTeam() {
        const input = document.getElementById('new-team-name');
        const name = input.value.trim();
        if (!name) return;
        teams.push({ name, score: 0 });
        input.value = '';
        saveTeams();
        renderScoreboards();
    }

    function deleteTeam(index) {
        teams.splice(index, 1);
        saveTeams();
        renderScoreboards();
    }

    function adjustScore(index, delta) {
        teams[index].score += delta;
        saveTeams();
        renderScoreboards();
    }

    function resetScores() {
        if (confirm("Reset all team scores to $0?")) {
            teams.forEach(t => t.score = 0);
            saveTeams();
            renderScoreboards();
        }
    }

    function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function buildBoard() {
        boardEl.innerHTML = '';
        gameData.forEach(col => {
            const header = document.createElement('div');
            header.className = 'category-header';
            header.innerText = col.category;
            boardEl.appendChild(header);
        });

        for (let rowIndex = 0; rowIndex < 5; rowIndex++) {
            gameData.forEach((col, colIndex) => {
                const qData = col.questions[rowIndex];
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.innerText = `$${qData.value}`;
                tile.dataset.col = colIndex;
                tile.dataset.row = rowIndex;
                tile.onclick = () => openQuestion(colIndex, rowIndex, tile);
                boardEl.appendChild(tile);
            });
        }
    }

    function openQuestion(colIndex, rowIndex, tile) {
        if (tile.classList.contains('used')) return;

        currentTile = tile;
        const qData = gameData[colIndex].questions[rowIndex];
        currentQuestionValue = qData.value;

        mCategory.innerText = gameData[colIndex].category;
        mValue.innerText = `$${qData.value}`;
        mQuestion.innerText = qData.q;
        mAnswer.innerText = qData.a;
        
        if (qData.image) {
            imageContainer.innerHTML = `<img src="${qData.image}" class="question-image" alt="Diagram">`;
            imageContainer.style.display = 'block';
        } else {
            imageContainer.innerHTML = '';
            imageContainer.style.display = 'none';
        }

        mAnswerContainer.style.display = 'none';
        btnReveal.style.display = 'inline-block';
        modalEl.style.display = 'flex';
    }

    function revealAnswer() {
        mAnswerContainer.style.display = 'block';
        btnReveal.style.display = 'none';
        renderModalAwardButtons();
    }

    function renderModalAwardButtons() {
        mAwardButtons.innerHTML = '';
        if (teams.length === 0) {
            mAwardButtons.innerHTML = `<span style="color: var(--text-muted); font-size: 0.85rem;">No teams configured. Use 'Team Setup' tab.</span>`;
            return;
        }

        teams.forEach((team, index) => {
            const btn = document.createElement('button');
            btn.className = 'btn-award';
            btn.innerText = `+ $${currentQuestionValue} (${team.name})`;
            btn.onclick = () => awardPointsAndClose(index);
            mAwardButtons.appendChild(btn);
        });

        const btnNone = document.createElement('button');
        btnNone.className = 'btn-award btn-award-none';
        btnNone.innerText = 'No One / Pass';
        btnNone.onclick = () => closeModal();
        mAwardButtons.appendChild(btnNone);
    }

    function awardPointsAndClose(teamIndex) {
        adjustScore(teamIndex, currentQuestionValue);
        closeModal();
    }

    function closeModal() {
        modalEl.style.display = 'none';
        if (currentTile) {
            currentTile.classList.add('used');
            currentTile.innerText = '—';
        }
    }

    buildBoard();
    renderScoreboards();
</script>

</body>
</html>
